name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore .\PostgresWpfDemo.slnx

      - name: Build
        run: dotnet build .\PostgresWpfDemo.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test .\tests\PostgresWpfDemo.Tests\PostgresWpfDemo.Tests.csproj --no-build --configuration Release

      - name: Publish
        run: dotnet publish .\src\PostgresWpfDemo\PostgresWpfDemo.csproj --configuration Release --output .\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostgresWpfDemo
          path: .\publish