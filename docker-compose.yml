services:
  postgres:
    image: postgres:17
    container_name: postgres-wpf-demo
    restart: unless-stopped

    environment:
      POSTGRES_DB: PostgresWpfDemoDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: